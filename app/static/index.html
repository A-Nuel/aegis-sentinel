<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aegis Sentinel — Public Findings</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121821;
      --border: #1e2a38;
      --text: #e8eef5;
      --muted: #8b9bb0;
      --accent: #3dd6c6;
      --high: #ff6b6b;
      --med: #ffc857;
      --low: #6bcb77;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    .meta { color: var(--muted); font-size: 0.85rem; }
    main { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;
    }
    button, select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { border-color: var(--accent); }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .Critical, .High { color: var(--high); border-color: #5a2a2a; }
    .Medium { color: var(--med); border-color: #5a4a20; }
    .Low { color: var(--low); border-color: #2a4a30; }
    .title { font-weight: 600; margin: 0.35rem 0 0.25rem; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    details { margin-top: 0.5rem; }
    summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Aegis <span>Sentinel</span></h1>
      <div class="meta">Public findings · continuous DeFi risk monitor</div>
    </div>
    <div class="meta" id="status">Loading…</div>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="scan">Scan ethereum now</button>
      <select id="severity">
        <option value="">All severities</option>
        <option>Critical</option>
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </div>
    <div id="list" class="empty">No findings yet. Run a scan or start the agent runner.</div>
  </main>
  <script>
    const explorers = {
      ethereum: (h) => `https://etherscan.io/tx/${h}`,
      arbitrum: (h) => `https://arbiscan.io/tx/${h}`,
      base: (h) => `https://basescan.org/tx/${h}`,
      optimism: (h) => `https://optimistic.etherscan.io/tx/${h}`,
      polygon: (h) => `https://polygonscan.com/tx/${h}`,
    };

    async function loadStatus() {
      try {
        const r = await fetch('/health');
        const j = await r.json();
        document.getElementById('status').textContent =
          `${j.status} · watched ${j.watched} · recent sample ${j.alerts}`;
      } catch {
        document.getElementById('status').textContent = 'API offline';
      }
    }

    function render(items) {
      const sev = document.getElementById('severity').value;
      const filtered = sev ? items.filter((x) => x.severity === sev) : items;
      const el = document.getElementById('list');
      if (!filtered.length) {
        el.className = 'empty';
        el.textContent = 'No findings match this filter.';
        return;
      }
      el.className = '';
      el.innerHTML = filtered.map((f) => {
        const link = f.tx_hash && explorers[f.chain]
          ? `<a href="${explorers[f.chain](f.tx_hash)}" target="_blank" rel="noopener">View tx</a>`
          : '';
        return `
          <article class="card">
            <div class="row">
              <span class="badge ${f.severity || ''}">${f.severity || '?'}</span>
              <span class="badge">${f.chain || ''}</span>
              <span class="muted">${f.type || ''}</span>
              ${link}
            </div>
            <div class="title">${f.title || f.type || 'Finding'}</div>
            <div class="muted">${f.means || f.raw_details || ''}</div>
            <details>
              <summary>Watch for &amp; harden</summary>
              <p><strong>Watch for:</strong> ${f.watch_for || '—'}</p>
              <p><strong>Harden:</strong> ${f.harden || '—'}</p>
            </details>
          </article>`;
      }).join('');
    }

    async function loadFindings() {
      const r = await fetch('/api/findings?limit=50');
      const items = await r.json();
      render(Array.isArray(items) ? items : []);
    }

    document.getElementById('refresh').onclick = () => { loadStatus(); loadFindings(); };
    document.getElementById('severity').onchange = () => loadFindings();
    document.getElementById('scan').onclick = async () => {
      document.getElementById('scan').disabled = true;
      try {
        await fetch('/api/scan?chain=ethereum&enrich=false', { method: 'POST' });
        await loadFindings();
        await loadStatus();
      } finally {
        document.getElementById('scan').disabled = false;
      }
    };

    loadStatus();
    loadFindings();
    setInterval(() => { loadStatus(); loadFindings(); }, 30000);
  </script>
</body>
</html>
